<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Letter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: black; /* Set the background to black */
            color: #fff; /* Change text color to white for better contrast */
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .letter-container {
            margin-top: 50px;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .letter-text {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            visibility: hidden;
        }

        /* Matrix-style animation */
        .matrix-container {
            position: relative;
            width: 100%;
            height: 300px;
            margin-top: 50px;
            overflow: hidden;
            color: #FF69B4;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }

        .matrix {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            white-space: nowrap;
        }

        /* Back to Home button */
        .back-to-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #0072ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
        }

        .back-to-home:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="letter-container">
        <div id="animated-text" class="letter-text"></div>
    </div>

    <div class="matrix-container">
        <div id="matrix" class="matrix"></div>
    </div>

    <!-- Back to Home button -->
    <button class="back-to-home" onclick="goHome()">Back to Home</button>

    <script>
        const text = ` 
            Hai Ainun Nazwa, 
            
            Aku tahu kita mungkin sudah tidak bersama lagi, tapi aku ingin kamu tahu bahwa setiap hari tanpamu selalu terasa berbeda. 
            Aku sering merindukan momen-momen kecil yang kita bagi. Aku meminta maaf untuk semua kesalahan yang pernah aku lakukan. 
            Kamu telah mengajarkan aku banyak hal, termasuk bagaimana menghargai seseorang yang berarti. 
            
            Aku akan selalu menyayangimu dari kejauhan dan mendoakan kebahagiaanmu. Terima kasih telah menjadi bagian dari hidupku. 
            
            Salam hangat, 
            Jua
        `;

        const container = document.getElementById("animated-text");
        let index = 0;

        function typeText() {
            if (index < text.length) {
                container.innerHTML += text.charAt(index);
                container.style.visibility = "visible";
                index++;
                setTimeout(typeText, 50); // Adjust typing speed here (50ms per character)
            }
        }

        // Matrix "Love" pattern
        const loveText = "I love you ";
        const heartShape = [
            "     I love you I love you I love you      ",
            "   I love you I love you I love you I love you   ",
            " I love you I love you I love you I love you I love you ",
            "I love you I love you I love you I love you I love you I love you",
            " I love you I love you I love you I love you I love you I love you ",
            "   I love you I love you I love you I love you I love you   ",
            "     I love you I love you I love you      ",
            "       I love you I love you I love you        ",
            "          I love you I love you         ",
            "             I love you             "
        ];

        let heartIndex = 0;
        const matrixContainer = document.getElementById("matrix");

        function updateHeartMatrix() {
            if (heartIndex < heartShape.length) {
                matrixContainer.innerHTML = heartShape.slice(0, heartIndex + 1).join("<br>");
                heartIndex++;
            } else {
                heartIndex = 0;
            }
        }

        // Update matrix every 300ms to create the heart animation
        setInterval(updateHeartMatrix, 300);

        // Start typing animation when page loads
        document.addEventListener("DOMContentLoaded", typeText);

        // Function to navigate back to the home page
        function goHome() {
            window.location.href = '/'; // Replace with the actual URL of your home page
        }
    </script>
</body>
</html>
